let currentCat=Object.keys(catMeta)[0],currentWord=null,animTimer=null;
function playWord(rate){if(!currentWord)return;const au=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(currentWord.word)+'&type=1');au.playbackRate=rate;au.play().catch(()=>{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(currentWord.word);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u);}});}
function selectWord(w,cardEl,cat){if(cat)currentCat=cat;currentWord=w;document.querySelectorAll('.word-card').forEach(c=>c.classList.remove('active'));if(cardEl)cardEl.classList.add('active');const m=catMeta[currentCat];const panel=document.getElementById('detailPanel');panel.style.display='block';document.getElementById('dCat').textContent=m.label;document.getElementById('dCat').style.cssText='background:'+m.bg+';color:'+m.color+';display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;margin-bottom:8px;font-weight:600;';document.getElementById('dWord').textContent=w.word;document.getElementById('dWord').style.color=m.color;document.getElementById('dPh').textContent=w.ph;document.getElementById('dMn').textContent=w.mn;const box=document.getElementById('animBox');const icon=document.getElementById('animIcon');box.style.background=m.bg;icon.textContent=w.ic;icon.style.cssText=anims[w.word.charCodeAt(0)%anims.length]+';display:inline-block;';if(animTimer)clearTimeout(animTimer);animTimer=setTimeout(()=>{icon.style.animation='none';},3000);playWord(1);panel.scrollIntoView({behavior:'smooth',block:'nearest'});}

function buildTabs(){const tabBar=document.getElementById('tabBar');Object.keys(catMeta).forEach(cat=>{const m=catMeta[cat];const t=document.createElement('div');t.className='tab';t.dataset.cat=cat;t.textContent=m.label;t.onclick=()=>renderCat(cat);tabBar.appendChild(t);});}
function doSearch(val){const q=val.trim().toLowerCase();document.getElementById('searchClear').style.display=q?'block':'none';const sr=document.getElementById('searchResults'),mc=document.getElementById('mainContent'),tabs=document.getElementById('tabBar');if(!q){sr.style.display='none';mc.style.display='';tabs.style.display='flex';return;}mc.style.display='none';tabs.style.display='none';sr.style.display='block';const hits=[];Object.keys(words).forEach(cat=>words[cat].forEach(w=>hits.push({...w,cat})));const filtered=hits.filter(w=>w.word.toLowerCase().includes(q)||w.mn.includes(q));if(!filtered.length){sr.innerHTML='<div class="search-empty">😕 没找到"'+val+'"</div>';return;}sr.innerHTML='';const grid=document.createElement('div');grid.className='cards-grid';filtered.forEach(w=>grid.appendChild(makeCard(w,w.cat)));sr.appendChild(grid);}
